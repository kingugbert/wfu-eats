services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wfueats
      POSTGRES_USER: wfueats
      POSTGRES_PASSWORD: localdev123
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://wfueats:localdev123@db:5432/wfueats
      JWT_SECRET: local-dev-secret-change-in-production
      PORT: 4000
      NODE_ENV: development
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY}
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
        NEXT_PUBLIC_GOOGLE_MAPS_KEY: ${GOOGLE_MAPS_KEY}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
